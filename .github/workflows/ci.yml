name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The setup path reads editor directories that differ per platform, and
    # releases ship for all three, so all three are tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # v8 is the action that runs golangci-lint v2, which this repo's
      # .golangci.yml is written for.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-wasip1
      - run: cargo build --release --target wasm32-wasip1
        working-directory: zed-extension
